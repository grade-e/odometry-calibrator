odom_linear_calibrator:
  ros__parameters:
    axis: "x"
    direction: 1
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    cmd_vel_frame_id: base_link
    target_distance: 0.5
    distance_tolerance: 0.005
    control_mode: p_min_clamped
    kp: 0.4
    max_velocity: 0.1
    min_velocity: 0.05
    max_acceleration: 0.05
    control_rate_hz: 20.0
    stop_publish_rate_hz: 10.0
    motion_timeout_sec: 20.0
    keep_alive_after_done: true

test_mock_odom_publisher:
  ros__parameters:
    odom_topic: /odom
    mock_axis: "x"
    direction: 1
    publish_rate_hz: 20.0
    mock_speed: 0.05
    start_x: 0.0
    start_y: 0.0
